name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-toolrunner.txt

      - name: Compile application and DaveHarness
        run: |
          python -m py_compile app.py project_context.py davellm_shell.py davellm_files.py davellm_markdown.py davellm_git.py davellm_native_tools.py davellm_edit.py davellm_ollama.py davellm_web.py davellm_public_http.py davellm_node_profiles.py davellm_notion.py davellm_toolpack.py davellm_toolpack_catalog.py davellm_toolpack_cluster.py davellm_toolpack_http.py davellm_toolpack_jobs.py davellm_toolpack_local.py davellm_toolpack_notion.py davellm_toolpack_runner.py scripts/tool_job_runner.py scripts/project_context_cli.py tool_executor.py
          python -m compileall -q daveharness
          python -m py_compile scripts/check_notion_adapter.py

      - name: Tests
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report
          python -m coverage xml

      - name: Notion adapter coverage
        run: |
          python -m coverage run --rcfile=/dev/null --branch --source=davellm_notion --data-file=.coverage-notion -m pytest -q tests/test_notion_tools.py tests/test_notion_adversarial.py tests/test_notion_independent_review.py
          python -m coverage report --rcfile=/dev/null --data-file=.coverage-notion --show-missing --fail-under=90

      - name: Offline qualification and load
        run: |
          python scripts/qualify_daveharness.py --output qualification-report.json
          python scripts/measure_daveharness.py > load-report.json

      - name: Qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-python-${{ matrix.python }}
          path: |
            coverage.xml
            qualification-report.json
            load-report.json

      - name: DaveHarness strict types
        run: python -m mypy daveharness

      - name: JavaScript syntax check
        run: |
          for file in static/app.js static/console.js static/anticipation.js static/prompt-contract.js static/vendor/gsap/gsap.min.js desktop/main.js desktop/preload.js; do
            node --check "$file"
          done

      - name: Run ledger and approval preview regressions
        run: node --test tests/test_run_ledger_watch.mjs tests/test_approval_preview.mjs tests/test_console.mjs tests/test_markdown_render.mjs tests/test_composer.mjs

      - name: Shell syntax check
        run: bash -n deploy/check-cluster.sh scripts/verify-cluster.sh scripts/macos/install-launcher.sh scripts/macos/install-whisper-runtime.sh scripts/macos/launch-davellm.sh

      - name: npm install
        run: npm ci

      - name: Dependency tree check
        run: npm ls --depth=0

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Compact workspace browser fixture
        if: matrix.python == '3.14'
        timeout-minutes: 5
        run: |
          npx playwright install --with-deps chromium
          node tests/browser_workspace.cjs

      - name: Console keyboard and landmark fixtures
        if: matrix.python == '3.14'
        timeout-minutes: 2
        run: |
          node --check tests/browser_navigation.cjs
          git fetch --no-tags --depth=1 origin 179a79c0459a77976249bbf1f7a3672496726dcc
          xvfb-run -a node_modules/.bin/electron --no-sandbox tests/browser_navigation.cjs

      - name: Whitespace check
        run: git diff --check
