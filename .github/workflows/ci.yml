name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile application and DaveHarness
        run: |
          python -m py_compile app.py project_context.py davellm_shell.py davellm_files.py scripts/project_context_cli.py tool_executor.py
          python -m compileall -q daveharness

      - name: Tests
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report
          python -m coverage xml

      - name: Offline qualification and load
        run: |
          python scripts/qualify_daveharness.py --output qualification-report.json
          python scripts/measure_daveharness.py > load-report.json

      - name: Qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-python-${{ matrix.python }}
          path: |
            coverage.xml
            qualification-report.json
            load-report.json

      - name: DaveHarness strict types
        run: python -m mypy daveharness

      - name: JavaScript syntax check
        run: node --check static/app.js static/anticipation.js static/prompt-contract.js static/vendor/gsap/gsap.min.js desktop/main.js desktop/preload.js

      - name: Run ledger stream regression
        run: node --test tests/test_run_ledger_watch.mjs

      - name: Shell syntax check
        run: bash -n deploy/check-cluster.sh scripts/verify-cluster.sh scripts/macos/install-launcher.sh scripts/macos/install-whisper-runtime.sh scripts/macos/launch-davellm.sh

      - name: npm install
        run: npm ci

      - name: Dependency tree check
        run: npm ls --depth=0

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Whitespace check
        run: git diff --check
